<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- normalize css -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- global css -->
    <link rel="stylesheet" href="./assets/css/global.css" />

    <!-- javascript main -->
    <script src="./assets/js/main.js" defer></script>

    <!-- font google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="content" id="pokedex">
      <h1>Pokedex</h1>
      <ol class="pokemons"></ol>
    </section>

    <div class="pokemon-modal hidden" id="pokemonModal" aria-hidden="true">
      <div class="pokemon-modal__card" id="pokemonModalCard">
        <button class="pokemon-modal__close" id="closePokemonModal" type="button" aria-label="Fechar detalhes">
          ×
        </button>

        <div class="pokemon-modal__header">
          <div class="pokemon-modal__info">
            <span class="pokemon-modal__number" id="modalPokemonNumber">#000</span>
            <h2 class="pokemon-modal__name" id="modalPokemonName">Pokemon</h2>
            <ul class="pokemon-modal__types" id="modalPokemonTypes"></ul>
          </div>
          <img class="pokemon-modal__image" id="modalPokemonImage" src="" alt="" />
        </div>

        <div class="pokemon-modal__body">
          <div class="pokemon-modal__meta">
            <div>
              <span>Altura</span>
              <strong id="modalPokemonHeight">0 m</strong>
            </div>
            <div>
              <span>Peso</span>
              <strong id="modalPokemonWeight">0 kg</strong>
            </div>
          </div>

          <div class="pokemon-modal__stats">
            <h3>Estatísticas</h3>
            <ul id="modalPokemonStats"></ul>
          </div>

          <div class="pokemon-modal__abilities">
            <h3>Habilidades</h3>
            <ul id="modalPokemonAbilities"></ul>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
